name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Create .env
        run: echo 'DATABASE_URL=file:/home/runner/work/cybersecurity-command-center/cybersecurity-command-center/db/custom.db' > .env
      - run: mkdir -p db
      - run: bun run db:push
      - run: bun run scripts/seed.ts || true
      - run: bun run scripts/security-test.ts
      - run: bun run scripts/adversarial-test.ts
      - run: bun run scripts/redact-test.ts
      - run: bun run scripts/backup-test.ts

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Create .env
        run: echo 'DATABASE_URL=file:/home/runner/work/cybersecurity-command-center/cybersecurity-command-center/db/custom.db' > .env
      - run: mkdir -p db
      - run: bun run db:push
      - run: bun run build
